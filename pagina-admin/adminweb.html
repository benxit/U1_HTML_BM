<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>

    <link rel="stylesheet" href="../pagina-admin/adminweb.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div>
            <div class="logo">
                <h2>SportClub</h2>
                <span>Admin Panel</span>
            </div>

            <nav>
                <ul>
                    <li class="active">🏠 Dashboard</li>
                    <li>👥 Usuarios</li>
                    <li>📊 Reportes</li>
                    <li>⚙️ Configuración</li>
                </ul>
            </nav>
        </div>

        <button class="btn-logout" onclick="cerrarSesion()">
            Cerrar Sesión
        </button>

    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <!-- TOP -->
        <header class="topbar">
            <div>
                <h1>Bienvenido Administrador</h1>
                <p>Control total del sistema</p>
            </div>

            <button class="btn-add" id="toggleFormBtn">
                + Crear Usuario
            </button>
        </header>

        <!-- FORM -->
        <div id="formContainer" style="display:none; margin-bottom:20px;">

            <form id="createUserForm">

                <input type="text" id="full_name" placeholder="Nombre completo" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Contraseña" required>

                <select id="role">
                    <option value="user">User</option>
                    <option value="coach">Coach</option>
                    <option value="admin">Admin</option>
                </select>

                <button type="submit">Crear usuario</button>

                <p id="message"></p>

            </form>

        </div>

        <!-- TABLE -->
        <section>

            <table border="1" width="100%">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="usersTable"></tbody>

            </table>

        </section>

    </main>

</div>

<script src="../pagina-admin/script.js"></script>
<!-- MODAL EDITAR USUARIO -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Editar Usuario</h2>

        <input type="hidden" id="edit_id">

        <label>Nombre</label>
        <input type="text" id="edit_name">

        <label>Rol</label>
        <select id="edit_role">
            <option value="user">User</option>
            <option value="coach">Coach</option>
            <option value="admin">Admin</option>
        </select>

        <div class="modal-actions">

            <button onclick="guardarEdicion()">Guardar</button>
            <button onclick="cerrarModal()">Cancelar</button>

        </div>

    </div>

</div>

</body>
</html>
