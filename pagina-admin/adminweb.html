<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>

    <link rel="stylesheet" href="../pagina-admin/adminweb.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>SportClub</h2>
            </div>

            <nav>
                <ul>
                    <li class="active">Usuarios</li>
                    <li>Reportes</li>
                    <li>Configuración</li>
                </ul>
            </nav>

            <a class="btn-logout" href="../index.html" onclick="cerrarSesion()">
                Cerrar Sesión
            </a>

        </aside>

        <!-- Main -->
        <main class="main-content">

            <!-- Header -->
            <header class="topbar">

                <div>
                    <h1>Panel Administrador</h1>
                    <p>Control y gestión del sistema</p>
                </div>

                <button class="btn-add" id="toggleFormBtn">
                    + Nuevo Usuario
                </button>

            </header>

            <!-- Cards -->
            <section class="stats">

                <div class="card">
                    <h3>Usuarios activos</h3>
                    <p>128</p>
                </div>

                <div class="card">
                    <h3>Clases del día</h3>
                    <p>12</p>
                </div>

                <div class="card">
                    <h3>Total Coaches</h3>
                    <p>8</p>
                </div>

            </section>

            <!-- Formulario -->
            <section class="form-container" id="formContainer">

                <h2>Crear Usuario</h2>

                <form id="createUserForm">

                    <input
                        type="text"
                        id="full_name"
                        placeholder="Nombre completo"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Correo electrónico"
                        required
                    >

                    <select id="role">
                        <option value="user">Usuario</option>
                        <option value="coach">Coach</option>
                        <option value="admin">Administrador</option>
                    </select>

                    <input
                        type="password"
                        id="password"
                        placeholder="Contraseña"
                        required
                    >

                    <button type="submit">
                        Crear Usuario
                    </button>

                </form>

                <p id="message"></p>

            </section>

            <!-- Tabla -->
            <section class="users-section">

                <div class="section-header">
                    <h2>Gestión de Usuarios</h2>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="usersTable">

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
