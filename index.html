<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub</title>
    <link rel="stylesheet" href="color.css">
</head>
<body>

    <div class="caja">

        <img id="imagen-logo" src="images/logo_empresa_letra_v1.png" alt="logo">

        <h2 id="titulo">Inicio sesión</h2>

        <form id="loginForm">

            <label>Email:</label>
            <input type="email" id="correo" placeholder="Ingrese correo" required>

            <label>Contraseña:</label>
            <input type="password" id="password" placeholder="Ingrese contraseña" required>

            <!-- BOTÓN -->
            <button id="boton-inicio" type="submit">Ingresar</button>

        </form>

        <p id="error"></p>

        <!-- LINKS -->
        <div class="links">
            <a href="pagina-revocer/revocer.html">¿Olvidaste tu contraseña?</a>
            <a href="pagina-registro/registro.html">Registrarse</a>
        </div>

    </div>
    <script src="script.js"></script>

</body>
</html>
